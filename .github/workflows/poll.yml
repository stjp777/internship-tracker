name: Poll internships

on:
  schedule:
    - cron: "*/30 * * * *"    # every 30 min (GitHub may delay a few minutes)
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      seed:
        description: "Seed run: fill the db but suppress notifications"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-cloud.txt
      - name: Poll career pages, notify, render dashboard
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python cloud_poll.py ${{ github.event.inputs.seed == 'true' && '--seed' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: poll
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
